{% extends "base.html" %}
{% block title %}Fehler – WAF Monitor{% endblock %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">{% endblock %}

{% block content %}
<div class="login-shell">
    <div class="brand">
        {% include "partials/_brand_mark.html" %}
        <div class="brand-text">
            <div class="brand-name">WAF Monitor</div>
            <div class="brand-sub">appfw · policy console</div>
        </div>
    </div>

    <div class="panel">
        <h1>Fehler</h1>
        <p class="hint">{{ error }}</p>
        <a href="{{ url_for('dashboard') }}" class="submit-btn" style="display:block; text-align:center; text-decoration:none;">
            Zurück zum Dashboard
        </a>
    </div>
</div>
{% endblock %}
