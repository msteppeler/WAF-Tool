<div class="profile-subheading" onclick="toggleDetails('checks-{{ profile.name }}')">
    <span>{{ t('profile.security_checks') }}</span>
    <span class="section-toggle closed" id="arrow-checks-{{ profile.name }}">▾</span>
</div>
<div class="checks-list" id="details-checks-{{ profile.name }}">
    {% for check in profile._checks %}
        <div class="check-row" id="check-row-{{ profile.name }}-{{ check.key }}"
             data-profile="{{ profile.name }}" data-check-key="{{ check.key }}">
            <div class="check-summary {% if not check.details %}no-details{% endif %}"
                 {% if check.details %}onclick="toggleDetails('check-{{ profile.name }}-{{ check.key }}')"{% endif %}>
                <span class="check-name {% if not check.active %}inactive{% endif %}">{{ check.label }}</span>
                <span class="check-boxes" onclick="event.stopPropagation()">
                    {% if check.supports_learn %}
                    <label><input type="checkbox" class="check-action-box" data-token="learn" {% if check.learn %}checked{% endif %}> Learning</label>
                    {% endif %}
                    <label><input type="checkbox" class="check-action-box" data-token="block" {% if check.block %}checked{% endif %}> Block</label>
                    <label><input type="checkbox" class="check-action-box" data-token="stats" {% if check.stat %}checked{% endif %}> Stat</label>
                    <label><input type="checkbox" class="check-action-box" data-token="log" {% if check.log %}checked{% endif %}> Log</label>
                </span>
            </div>
            <div class="check-action-row" hidden>
                <button type="button" class="check-action-save" onclick="saveCheckAction(this)">{{ t('check.save') }}</button>
                <button type="button" class="check-action-cancel" onclick="cancelCheckAction(this)">{{ t('check.discard') }}</button>
                <span class="check-action-message"></span>
            </div>
            {% if check.details %}
                <div class="check-details" id="details-check-{{ profile.name }}-{{ check.key }}">
                    {% for key, value in check.details.items()|sort %}
                        <div class="detail-row">
                            <span class="k">{{ key }}</span>
                            {% include "partials/_field_value.html" %}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        </div>
    {% endfor %}
</div>
