{% if entry.is_buffer_overflow %}
    <div class="bo-action-row">
        {% if entry.is_blocked %}
            <button type="button" class="btn-bo-action btn-bo-relax"
                    data-profile="{{ entry.profile }}"
                    data-field="{{ entry.bo_field }}"
                    data-field-label="{{ entry.bo_field_label }}"
                    data-value="{{ entry.bo_observed_length }}"
                    data-current-max="{{ entry.bo_configured_max if entry.bo_configured_max is not none else '' }}"
                    onclick="handleBufferOverflowRelax(this)">
                Relaxation Rule erstellen ({{ entry.bo_field_label }} → {{ entry.bo_observed_length }})
            </button>
            {% if entry.bo_length_source == 'estimated' %}
                <div class="bo-note">
                    Länge geschätzt aus der Zeichenzahl der geloggten URL – in der Meldung wurde kein
                    exakter Wert von NetScaler gefunden. Vor dem Übernehmen prüfen.
                </div>
            {% endif %}
        {% else %}
            <button type="button" class="btn-bo-action btn-bo-activate"
                    data-profile="{{ entry.profile }}"
                    onclick="handleBufferOverflowActivate(this)">
                Activate (Block für Buffer Overflow aktivieren)
            </button>
        {% endif %}
    </div>
{% endif %}
