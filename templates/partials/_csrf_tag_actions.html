{% if entry.is_csrf_tag and entry.is_blocked and entry.csrf_can_relax %}
    <div class="bo-action-row">
        <button type="button" class="btn-bo-action btn-csrf-relax"
                data-profile="{{ entry.profile }}"
                data-origin="{{ entry.csrf_origin_suggestion }}"
                data-action="{{ entry.csrf_action_pattern }}"
                onclick="handleCsrfTagRelax(this)">
            Relaxation Rule erstellen (CSRF Form Tagging)
        </button>
        <div class="bo-note">Gilt nur für diese Form-Origin-/Form-Action-URL-Kombination, nicht profilweit. Beide Felder sind bei diesem Check Pflicht.</div>
    </div>
{% endif %}
