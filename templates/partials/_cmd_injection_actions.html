{% if entry.is_cmd_injection and entry.is_blocked and entry.cmd_can_relax %}
    <div class="bo-action-row">
        <button type="button" class="btn-bo-action btn-cmd-relax"
                data-profile="{{ entry.profile }}"
                data-field="{{ entry.cmd_field }}"
                data-location="{{ entry.cmd_location }}"
                data-url-pattern="{{ entry.cmd_url_pattern }}"
                data-flagged="{{ entry.cmd_flagged }}"
                data-tokens='{{ entry.cmd_tokens|tojson }}'
                data-scope-note="{{ entry.cmd_scope_note }}"
                onclick="handleCmdInjectionRelax(this)">
            {{ entry.cmd_button_label }}
        </button>
        <div class="bo-note">{{ entry.cmd_scope_note }}</div>
    </div>
{% endif %}
