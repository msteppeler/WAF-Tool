{% if entry.is_start_url and entry.is_blocked %}
    <div class="bo-action-row">
        <button type="button" class="btn-bo-action btn-su-relax"
                data-profile="{{ entry.profile }}"
                data-pattern="{{ entry.su_suggested_pattern }}"
                onclick="handleStartUrlRelax(this)">
            Relaxation Rule erstellen (Start URL → {{ entry.su_suggested_pattern }})
        </button>
    </div>
{% endif %}
